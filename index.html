<!DOCTYPE html>
<html lang="pt-BR" class="h-full antialiased dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Combogó Ponto - Sistema de Ponto Eletrônico</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-full flex flex-col bg-gray-950 text-gray-100 p-6 sm:p-12">
  <div class="max-w-4xl mx-auto w-full">
    <!-- Header -->
    <header class="flex justify-between items-center pb-6 mb-8 border-b border-gray-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-orange-400 to-amber-500 bg-clip-text text-transparent">
          Combogó Ponto ⏱️
        </h1>
        <p class="text-sm text-gray-400">Painel Web com Firebase Auth & Cloud Firestore</p>
      </div>

      <div id="user-header" class="hidden flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <p id="header-user-name" class="font-semibold text-sm text-white">Carregando...</p>
          <p id="header-user-role" class="text-xs text-orange-400 uppercase tracking-wider">Colaborador</p>
        </div>
        <button
          id="btn-logout"
          class="px-4 py-2 text-sm bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl hover:bg-red-500/20 transition"
        >
          Sair
        </button>
      </div>
    </header>

    <!-- Loading Spinner -->
    <div id="loading-container" class="flex items-center justify-center py-24">
      <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-orange-500"></div>
    </div>

    <!-- Auth Card (Login / Cadastro) -->
    <div id="auth-section" class="hidden max-w-md mx-auto bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl">
      <h2 id="auth-title" class="text-xl font-bold mb-2 text-center text-white">
        Acessar Painel
      </h2>
      <p class="text-sm text-gray-400 mb-6 text-center">
        Autenticação integrada com Firebase
      </p>

      <div id="auth-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs"></div>

      <form id="auth-form" class="flex flex-col gap-4">
        <div id="nome-group" class="hidden">
          <label class="block text-xs font-semibold text-gray-400 mb-1">Nome Completo</label>
          <input
            type="text"
            id="input-nome"
            placeholder="Seu nome"
            class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-orange-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">E-mail</label>
          <input
            type="email"
            id="input-email"
            required
            placeholder="email@empresa.com"
            class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-orange-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Senha</label>
          <input
            type="password"
            id="input-senha"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 bg-gray-950 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-orange-500"
          />
        </div>

        <button
          type="submit"
          id="btn-auth-submit"
          class="w-full py-3 bg-orange-500 hover:bg-orange-600 font-semibold rounded-xl text-white transition mt-2 shadow-lg shadow-orange-500/20"
        >
          Entrar
        </button>
      </form>

      <div class="flex items-center my-6 gap-3">
        <div class="flex-1 h-px bg-gray-800"></div>
        <span class="text-xs text-gray-500">OU</span>
        <div class="flex-1 h-px bg-gray-800"></div>
      </div>

      <button
        id="btn-google-login"
        type="button"
        class="w-full py-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 font-medium rounded-xl flex items-center justify-center gap-3 transition text-white"
      >
        <span>🌐</span>
        <span>Continuar com Google</span>
      </button>

      <button
        id="btn-toggle-auth"
        type="button"
        class="w-full mt-6 text-center text-xs text-orange-400 hover:underline"
      >
        Novo por aqui? Crie uma conta
      </button>
    </div>

    <!-- Dashboard / Pontos Section -->
    <div id="dashboard-section" class="hidden space-y-6">
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-white">
          <span>📋</span>
          <span>Registros no Firestore em Tempo Real</span>
        </h2>

        <div id="empty-state" class="hidden text-center py-12 text-gray-500">
          Nenhum registro de ponto encontrado no Cloud Firestore.
        </div>

        <div id="table-wrapper" class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-gray-950/50 text-gray-400 uppercase text-xs">
              <tr>
                <th class="px-4 py-3 rounded-l-lg">Tipo</th>
                <th class="px-4 py-3">Colaborador</th>
                <th class="px-4 py-3">Localização</th>
                <th class="px-4 py-3 rounded-r-lg">Data & Hora</th>
              </tr>
            </thead>
            <tbody id="pontos-tbody" class="divide-y divide-gray-800/50">
              <!-- Linhas renderizadas via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDKs via ESM CDN -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      onSnapshot, 
      doc, 
      getDoc, 
      setDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    // Firebase Configuração
    const firebaseConfig = {
      apiKey: "AIzaSyD3Tjefzcy-YxOr3c8YJ91HhH8AO3r1LuY",
      authDomain: "combogoponto.firebaseapp.com",
      projectId: "combogoponto",
      storageBucket: "combogoponto.firebasestorage.app",
      messagingSenderId: "20657185811",
      appId: "1:20657185811:web:21b6111d7a29b370a20be6",
      measurementId: "G-BJZKEBN9FH"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Estados
    let isCadastro = false;
    let unsubscribePontos = null;

    // Elementos DOM
    const loadingContainer = document.getElementById("loading-container");
    const authSection = document.getElementById("auth-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const userHeader = document.getElementById("user-header");
    const headerUserName = document.getElementById("header-user-name");
    const headerUserRole = document.getElementById("header-user-role");
    const btnLogout = document.getElementById("btn-logout");
    const authForm = document.getElementById("auth-form");
    const authTitle = document.getElementById("auth-title");
    const btnAuthSubmit = document.getElementById("btn-auth-submit");
    const btnToggleAuth = document.getElementById("btn-toggle-auth");
    const nomeGroup = document.getElementById("nome-group");
    const inputNome = document.getElementById("input-nome");
    const inputEmail = document.getElementById("input-email");
    const inputSenha = document.getElementById("input-senha");
    const btnGoogleLogin = document.getElementById("btn-google-login");
    const authError = document.getElementById("auth-error");
    const pontosTbody = document.getElementById("pontos-tbody");
    const emptyState = document.getElementById("empty-state");
    const tableWrapper = document.getElementById("table-wrapper");

    function showError(msg) {
      if (!msg) {
        authError.classList.add("hidden");
        authError.textContent = "";
      } else {
        authError.textContent = msg;
        authError.classList.remove("hidden");
      }
    }

    function toggleMode() {
      isCadastro = !isCadastro;
      showError("");
      if (isCadastro) {
        authTitle.textContent = "Criar Conta";
        btnAuthSubmit.textContent = "Cadastrar";
        btnToggleAuth.textContent = "Já possui conta? Faça login";
        nomeGroup.classList.remove("hidden");
        inputNome.required = true;
      } else {
        authTitle.textContent = "Acessar Painel";
        btnAuthSubmit.textContent = "Entrar";
        btnToggleAuth.textContent = "Novo por aqui? Crie uma conta";
        nomeGroup.classList.add("hidden");
        inputNome.required = false;
      }
    }

    btnToggleAuth.addEventListener("click", toggleMode);

    // Auth Form
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");
      const email = inputEmail.value.trim();
      const senha = inputSenha.value;
      const nome = inputNome.value.trim();

      try {
        if (isCadastro) {
          if (!nome) {
            showError("Informe seu nome completo");
            return;
          }
          const res = await createUserWithEmailAndPassword(auth, email, senha);
          await setDoc(doc(db, "usuarios", res.user.uid), {
            uid: res.user.uid,
            nome: nome,
            email: res.user.email,
            cargo: "colaborador",
            criadoEm: serverTimestamp()
          });
        } else {
          await signInWithEmailAndPassword(auth, email, senha);
        }
      } catch (err) {
        showError(err.message || "Erro na autenticação.");
      }
    });

    // Google Login
    btnGoogleLogin.addEventListener("click", async () => {
      showError("");
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        showError(err.message || "Erro ao entrar com o Google.");
      }
    });

    // Logout
    btnLogout.addEventListener("click", async () => {
      await signOut(auth);
    });

    // Listener de Autenticação
    onAuthStateChanged(auth, async (currentUser) => {
      loadingContainer.classList.add("hidden");

      if (currentUser) {
        authSection.classList.add("hidden");
        dashboardSection.classList.remove("hidden");
        userHeader.classList.remove("hidden");

        try {
          const userDoc = await getDoc(doc(db, "usuarios", currentUser.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            headerUserName.textContent = data.nome || currentUser.displayName || currentUser.email;
            headerUserRole.textContent = data.cargo || "Colaborador";
          } else {
            const newProf = {
              uid: currentUser.uid,
              nome: currentUser.displayName || "Colaborador Web",
              email: currentUser.email,
              cargo: "colaborador",
              criadoEm: serverTimestamp(),
            };
            await setDoc(doc(db, "usuarios", currentUser.uid), newProf);
            headerUserName.textContent = newProf.nome;
            headerUserRole.textContent = newProf.cargo;
          }
        } catch (e) {
          headerUserName.textContent = currentUser.displayName || currentUser.email;
        }

        listenPontos();
      } else {
        if (unsubscribePontos) {
          unsubscribePontos();
          unsubscribePontos = null;
        }
        userHeader.classList.add("hidden");
        dashboardSection.classList.add("hidden");
        authSection.classList.remove("hidden");
        pontosTbody.innerHTML = "";
      }
    });

    // Listener de Pontos em Tempo Real
    function listenPontos() {
      if (unsubscribePontos) unsubscribePontos();

      const q = query(collection(db, "pontos"), orderBy("registro", "desc"));
      unsubscribePontos = onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
          emptyState.classList.remove("hidden");
          tableWrapper.classList.add("hidden");
          return;
        }

        emptyState.classList.add("hidden");
        tableWrapper.classList.remove("hidden");
        pontosTbody.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const ponto = docSnap.data();
          const tr = document.createElement("tr");
          tr.className = "hover:bg-gray-800/30 transition";

          let dataStr = "-";
          if (ponto.registro) {
            const dateObj = ponto.registro.toDate ? ponto.registro.toDate() : new Date(ponto.registro);
            if (!isNaN(dateObj.getTime())) {
              dataStr = dateObj.toLocaleString("pt-BR");
            }
          }

          const isEntrada = ponto.tipo === "entrada";
          const badgeClass = isEntrada 
            ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"
            : "bg-rose-500/10 text-rose-400 border border-rose-500/20";
          const badgeLabel = isEntrada ? "🟢 Entrada" : "🔴 Saída";

          const localizacao = typeof ponto.localizacao === "string" ? ponto.localizacao : "Local registrado";
          const nomeColab = ponto.usuarioNome || ponto.usuarioEmail || "Não identificado";

          tr.innerHTML = `
            <td class="px-4 py-3">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                ${badgeLabel}
              </span>
            </td>
            <td class="px-4 py-3 font-medium text-white">${nomeColab}</td>
            <td class="px-4 py-3 text-gray-400">${localizacao}</td>
            <td class="px-4 py-3 font-mono text-xs text-gray-300">${dataStr}</td>
          `;

          pontosTbody.appendChild(tr);
        });
      }, (error) => {
        console.error("Erro ao escutar pontos:", error);
      });
    }
  </script>
</body>
</html>
